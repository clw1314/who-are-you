name: Check

# Fails when public/ no longer matches src/, a test fails, or the page breaks in a real browser (scripts/smoke.mjs).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
